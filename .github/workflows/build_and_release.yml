name: IKIZA V2 CI & Build Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test APK
    runs-on: ubuntu-latest
    permissions:
      contents: read


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package Artifacts & Calculate SHA-256 Checksum
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/IKIZA-v2-debug.apk
          cd artifacts
          sha256sum IKIZA-v2-debug.apk > IKIZA-v2-debug.apk.sha256
          echo "SHA256 Checksum computed:"
          cat IKIZA-v2-debug.apk.sha256

      - name: Upload Workflow Artifact (Branches & PRs)
        uses: actions/upload-artifact@v4
        with:
          name: IKIZA-v2-debug-apk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      # -------------------------------------------------------------------------------------------
      # PHASE 9 & 10: PUBLIC RELEASE PUBLISHING (GATED UNTIL SIGNING CONTINUITY IS CONFIGURED)
      # -------------------------------------------------------------------------------------------
      # The POCO X7 currently runs an app signed with the local debug certificate:
      # SHA-256: 92:2E:8B:5C:0B:8B:1D:D4:E6:7E:10:E0:C8:FB:12:92:83:AF:51:51:1B:65:FF:29:84:B2:7B:30:A2:0E:03:E3
      # To prevent shipping an APK with a random CI-generated keystore that fails to install,
      # public release publishing is kept disabled until the owner configures the keystore secret.
      # CI builds, unit tests, and GitHub Actions artifact uploads remain fully active.
